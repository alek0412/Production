# -----------------------------------------------------------------------------
# SPONSOR HANDOFF — edit THIS file first (canonical). Copy to repo handout after changes:
#   CIS-4375-Project/Capstone_Project/docs/cloudformation-reservation-capstone-sanitized.yaml
#
# Deploy: AWS Console → CloudFormation → Create stack → Upload template file
#   OR: aws cloudformation create-stack --stack-name ... --template-body file://...
#
# Before deploy: create an EC2 key pair in the target region (EC2 > Key Pairs).
# Parameters: ProjectPrefix defaults to student-lab style (Reservation_Capstone).
# Name tags match that pattern; subnet suffix uses live AZ (e.g. us-east-2a in Ohio).
#
# Web tier: internet-facing Application Load Balancer (HTTP:80) -> two EC2 instances
# (Amazon Linux 2023, one per public subnet/AZ). App traffic on port 3000 from ALB only.
# Entry URL is the ALB DNS name (no Elastic IP on instances). SSH still from AllowedIngressCidr.
# Amazon EFS (NFS) is created with mount targets in both public subnets so BOTH web instances
# share the same uploads + JSON app data (see /mnt/hbc-app/capstone/...). UserData mounts EFS
# at boot; symlink or bind your repo paths to those dirs after cloning (runbook).
# EC2 UserData installs httpd + MariaDB client + nfs-utils and mounts EFS; ALB health checks
# stay unhealthy until you deploy the Node app (port 3000) on BOTH instances — see project runbook.
# RDS: Multi-AZ MySQL (standby in second AZ). Higher cost than single-AZ lab stack.
# Updating an EXISTING stack from the older single-EIP template may replace resources — use Change Sets.
# -----------------------------------------------------------------------------

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Reservation capstone - VPC, public + private subnets, Application Load Balancer to two
  web EC2 instances (Amazon Linux 2023, one per AZ), Amazon EFS shared storage (NFS) for both
  web instances, Multi-AZ MySQL RDS in private subnets, S3 gateway endpoint on private route
  tables. All resources are created by this stack.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ProjectPrefix
          - Environment
      - Label:
          default: Network (change only if these CIDRs conflict)
        Parameters:
          - VpcCidrBlock
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
      - Label:
          default: EC2
        Parameters:
          - KeyName
          - WebInstanceType
          - AllowedIngressCidr
      - Label:
          default: Database
        Parameters:
          - DbInstanceClass
          - DbAllocatedStorage
          - DbName
          - DbMasterUsername
          - MySqlEngineVersion

Parameters:
  ProjectPrefix:
    Type: String
    Default: Reservation_Capstone
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_.-]{2,40}$"
    Description: "Name prefix for VPC resources (student lab used Reservation_Capstone)."
    ConstraintDescription: Letters, numbers, dot, underscore, hyphen; start with a letter.

  Environment:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]{1,12}$"
    Description: "Used for stack-scoped IDs (e.g. RDS identifier via stack name), not in VPC Name tags."

  VpcCidrBlock:
    Type: String
    Default: 10.0.0.0/16
    Description: Must not overlap other VPCs in this account/region.

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/20

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.16.0/20

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.128.0/20

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.144.0/20

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name in this region (create under EC2 > Key Pairs first).

  WebInstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      CIDR allowed to reach the load balancer (HTTP/HTTPS) and SSH to EC2 (port 22).
      App port 3000 is open only to the ALB security group (tighten for production).

  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100

  DbName:
    Type: String
    Default: reservation_db
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,63}$"

  DbMasterUsername:
    Type: String
    Default: dbadmin
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"

  MySqlEngineVersion:
    Type: String
    Default: "8.0"
    Description: MySQL major.minor for RDS (patch level is managed by RDS).

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidrBlock
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub
            - "${Prefix}-subnet-public1-${Az}"
            - Prefix: !Ref ProjectPrefix
              Az: !Select [0, !GetAZs ""]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub
            - "${Prefix}-subnet-public2-${Az}"
            - Prefix: !Ref ProjectPrefix
              Az: !Select [1, !GetAZs ""]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub
            - "${Prefix}-subnet-private1-${Az}"
            - Prefix: !Ref ProjectPrefix
              Az: !Select [0, !GetAZs ""]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub
            - "${Prefix}-subnet-private2-${Az}"
            - Prefix: !Ref ProjectPrefix
              Az: !Select [1, !GetAZs ""]

  PublicRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-RouteTable-public-1"

  PublicRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-RouteTable-public-2"

  DefaultPublicRoute1:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  DefaultPublicRoute2:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable1
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable2
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub
            - "${Prefix}-RouteTable-Private-1-${Az}"
            - Prefix: !Ref ProjectPrefix
              Az: !Select [0, !GetAZs ""]

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub
            - "${Prefix}-RouteTable-Private-2-${Az}"
            - Prefix: !Ref ProjectPrefix
              Az: !Select [1, !GetAZs ""]

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-vpce-s3"

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectPrefix}-alb-sg"
      GroupDescription: Internet-facing ALB (HTTP/HTTPS from AllowedIngressCidr)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-alb-sg"

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectPrefix}-web-sg"
      GroupDescription: Web EC2 - SSH from Cidr; app port 3000 from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedIngressCidr
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-web-sg"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: Private-DB-SG
      GroupDescription: Private Security Group for Database
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Private-DB-SG

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${AWS::StackName}-db-subnets"
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-db-subnets"

  # --- Shared file storage (NFS) for multi-instance uploads + Back-End/data JSON ---
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectPrefix}-efs-sg"
      GroupDescription: EFS — NFS (2049) from web tier only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref WebSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-efs-sg"

  AppEfsFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      FileSystemTags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-app-efs"

  AppEfsMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref AppEfsFileSystem
      SubnetId: !Ref PublicSubnet1
      SecurityGroups:
        - !Ref EfsSecurityGroup

  AppEfsMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref AppEfsFileSystem
      SubnetId: !Ref PublicSubnet2
      SecurityGroups:
        - !Ref EfsSecurityGroup

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-db"
      DBName: !Ref DbName
      Engine: mysql
      EngineVersion: !Ref MySqlEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp2
      MasterUsername: !Ref DbMasterUsername
      ManageMasterUserPassword: true
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      BackupRetentionPeriod: 1
      PreferredBackupWindow: "03:00-04:00"
      MultiAZ: true
      PubliclyAccessible: false
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-rds"

  WebServer:
    Type: AWS::EC2::Instance
    DependsOn:
      - AppEfsMountTarget1
      - AppEfsMountTarget2
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref WebInstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              dnf update -y
              dnf install -y httpd mariadb105 nfs-utils
              systemctl start httpd
              systemctl enable httpd
              EFS_DNS="${EfsId}.efs.${AWS::Region}.amazonaws.com"
              mkdir -p /mnt/hbc-app
              for attempt in $$(seq 1 36); do
                if mountpoint -q /mnt/hbc-app 2>/dev/null; then
                  break
                fi
                if mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport "$$EFS_DNS:/" /mnt/hbc-app; then
                  break
                fi
                sleep 10
              done
              if ! mountpoint -q /mnt/hbc-app; then
                echo "EFS mount failed after retries — check EFS security group and mount targets." >&2
                exit 1
              fi
              mkdir -p /mnt/hbc-app/capstone/Front-End/uploads /mnt/hbc-app/capstone/Back-End/data
              chown -R ec2-user:ec2-user /mnt/hbc-app/capstone
              if ! grep -qF "$$EFS_DNS:/ /mnt/hbc-app" /etc/fstab; then
                echo "$$EFS_DNS:/ /mnt/hbc-app nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,_netdev,noresvport 0 0" >> /etc/fstab
              fi
            - EfsId: !Ref AppEfsFileSystem
      Tags:
        - Key: Name
          Value: Reservation-Web-Server-A

  WebServer2:
    Type: AWS::EC2::Instance
    DependsOn:
      - AppEfsMountTarget1
      - AppEfsMountTarget2
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref WebInstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              dnf update -y
              dnf install -y httpd mariadb105 nfs-utils
              systemctl start httpd
              systemctl enable httpd
              EFS_DNS="${EfsId}.efs.${AWS::Region}.amazonaws.com"
              mkdir -p /mnt/hbc-app
              for attempt in $$(seq 1 36); do
                if mountpoint -q /mnt/hbc-app 2>/dev/null; then
                  break
                fi
                if mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport "$$EFS_DNS:/" /mnt/hbc-app; then
                  break
                fi
                sleep 10
              done
              if ! mountpoint -q /mnt/hbc-app; then
                echo "EFS mount failed after retries — check EFS security group and mount targets." >&2
                exit 1
              fi
              mkdir -p /mnt/hbc-app/capstone/Front-End/uploads /mnt/hbc-app/capstone/Back-End/data
              chown -R ec2-user:ec2-user /mnt/hbc-app/capstone
              if ! grep -qF "$$EFS_DNS:/ /mnt/hbc-app" /etc/fstab; then
                echo "$$EFS_DNS:/ /mnt/hbc-app nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,_netdev,noresvport 0 0" >> /etc/fstab
              fi
            - EfsId: !Ref AppEfsFileSystem
      Tags:
        - Key: Name
          Value: Reservation-Web-Server-B

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: InternetGatewayAttachment
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-alb"

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      Targets:
        - Id: !Ref WebServer
          Port: 3000
        - Id: !Ref WebServer2
          Port: 3000
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-tg-app"

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  LoadBalancerDnsName:
    Description: Internet-facing Application Load Balancer DNS name (primary site URL)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  WebUrl:
    Description: HTTP URL through the load balancer (app must listen on port 3000 on both instances)
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  WebServerAPublicIp:
    Description: Public IPv4 of web instance A (SSH — ephemeral unless you attach an EIP)
    Value: !GetAtt WebServer.PublicIp

  WebServerBPublicIp:
    Description: Public IPv4 of web instance B (SSH — ephemeral unless you attach an EIP)
    Value: !GetAtt WebServer2.PublicIp

  RdsEndpoint:
    Description: RDS MySQL endpoint (private - reach only from web SG / VPC)
    Value: !GetAtt Database.Endpoint.Address

  RdsPort:
    Description: RDS port
    Value: !GetAtt Database.Endpoint.Port

  DbMasterSecretArn:
    Description: Secrets Manager ARN for RDS master user (auto-generated password)
    Value:
      Fn::GetAtt:
        - Database
        - MasterUserSecret.SecretArn

  SshHint:
    Description: SSH example — use WebServerAPublicIp or WebServerBPublicIp from Outputs or EC2 console
    Value: "ssh -i your-key.pem ec2-user@<WebServerAPublicIp or WebServerBPublicIp>"

  EfsFileSystemId:
    Description: Amazon EFS file system ID (shared by both web instances at /mnt/hbc-app)
    Value: !Ref AppEfsFileSystem

  SharedAppDataHint:
    Description: >
      After cloning the app, point uploads and JSON data at EFS — e.g. symlink
      ~/CIS-4375-Project/Capstone_Project/Front-End/uploads -> /mnt/hbc-app/capstone/Front-End/uploads
      and Capstone_Project/Back-End/data -> /mnt/hbc-app/capstone/Back-End/data (same on both instances).
    Value: "/mnt/hbc-app/capstone"
