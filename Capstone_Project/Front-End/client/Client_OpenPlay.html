<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How To Play — Houston Badminton Center</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Minimal shell: only a floating ✕ — PDF opens in iframe below (raw .pdf URL has no room for our UI). */
    body { margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .openplay-header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      height: 0;
      pointer-events: none;
    }
    .openplay-close {
      pointer-events: auto;
      position: absolute;
      top: max(0.5rem, env(safe-area-inset-top));
      right: max(0.5rem, env(safe-area-inset-right));
      z-index: 11;
      width: 30px;
      height: 30px;
      min-width: 30px;
      min-height: 30px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      background: rgba(255, 255, 255, 0.92);
      color: #4b5563;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .openplay-close:hover {
      background: #fff;
      border-color: rgba(0, 0, 0, 0.22);
      color: #111827;
    }
    .openplay-frame-wrap {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      padding-top: 0;
    }
    .openplay-frame-wrap iframe {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <header class="openplay-header">
    <a href="General_Dashboard.html" class="openplay-close" aria-label="Close and return to home">&times;</a>
  </header>
  <div class="openplay-frame-wrap">
    <iframe src="../images/HBC-OpenPlay.pdf" title="How to Play at the Houston Badminton Center"></iframe>
  </div>
  <script src="../js/client-nav.js"></script>
</body>
</html>
